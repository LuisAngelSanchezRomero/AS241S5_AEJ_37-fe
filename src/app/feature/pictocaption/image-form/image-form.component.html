<div class="image-form-container">
  <!-- Indicador de modo edición -->
  <div *ngIf="editingItem" style="background: #06b6d4; color: white; padding: 10px; border-radius: 5px; margin-bottom: 15px;">
    MODO EDICIÓN ACTIVO - Editando ID: {{ editingItem.id }}
  </div>
  
  <form (ngSubmit)="onSubmit()" #imageForm="ngForm">
    <div class="form-group">
      <label for="imageUrl">
        <svg class="icon" viewBox="0 0 24 24">
          <path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H6.9C4.29 7 2.2 9.09 2.2 11.7s2.09 4.7 4.7 4.7H11v-1.9H6.9c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm5-6h4.1c2.61 0 4.7 2.09 4.7 4.7s-2.09 4.7-4.7 4.7H13v1.9h4.1c2.61 0 4.7-2.09 4.7-4.7S19.71 7 17.1 7H13v1.9z"/>
        </svg>
        URL de la Imagen:
      </label>
      <input 
        type="url"
        id="imageUrl"
        name="imageUrl"
        [(ngModel)]="imageUrl"
        class="form-control"
        placeholder="https://ejemplo.com/imagen.jpg"
        required
        [disabled]="isLoading">
      
      <div class="form-helper">
        <small class="form-text">
          <svg class="icon" viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
          </svg>
          Formatos soportados: JPG, PNG, GIF, WEBP
        </small>
        <a href="https://imgbb.com/" target="_blank" class="upload-link">
          <svg class="icon" viewBox="0 0 24 24">
            <path d="M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20Z"/>
          </svg>
          Convierte tu imagen descargada a URL
        </a>
      </div>
    </div>

    <!-- Preview de la imagen -->
    <div class="image-preview glass-effect" *ngIf="imageUrl && isValidUrl(imageUrl)">
      <label>
        <svg class="icon" viewBox="0 0 24 24">
          <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
        </svg>
        Vista previa:
      </label>
      <div class="preview-container">
        <img [src]="imageUrl" alt="Vista previa" (error)="errorMessage = 'Error al cargar la imagen'">
        <div class="preview-overlay">
          <svg class="icon" viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm3.5 6L12 10.5 8.5 8 12 5.5 15.5 8zM12 17.5L8.5 15 12 12.5 15.5 15 12 17.5z"/>
          </svg>
        </div>
      </div>
    </div>

    <div class="error-message glass-effect" *ngIf="errorMessage">
      <svg class="icon" viewBox="0 0 24 24">
        <path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/>
      </svg>
      {{ errorMessage }}
    </div>

    <div class="form-actions">
      <button 
        type="submit" 
        class="btn btn-primary"
        [disabled]="isLoading || !imageUrl.trim()">
        <span *ngIf="isLoading" class="spinner"></span>
        <svg *ngIf="!isLoading" class="icon" viewBox="0 0 24 24">
          <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
        </svg>
        {{ isLoading ? 'Analizando...' : (editingItem ? 'Actualizar Análisis' : 'Analizar Imagen') }}
      </button>
      
      <button 
        type="button" 
        class="btn btn-secondary"
        (click)="cancel()"
        [disabled]="isLoading">
        <svg class="icon" viewBox="0 0 24 24">
          <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
        </svg>
        Cancelar
      </button>
    </div>
  </form>
</div>
