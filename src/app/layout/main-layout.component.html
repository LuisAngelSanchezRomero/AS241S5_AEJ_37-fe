<div class="main-layout">
  <header class="header">
    <div class="container">
      <h1 class="logo">VisionAI</h1>
      <nav class="nav">
        <a routerLink="/glm" routerLinkActive="active" class="nav-link">
          <svg class="icon icon-ai" viewBox="0 0 24 24">
            <path d="M12 2L13.09 8.26L22 9L13.09 15.74L12 22L10.91 15.74L2 9L10.91 8.26L12 2Z" stroke="currentColor" stroke-width="1.5" fill="none"/>
          </svg>
          Pregúntale a Chat GLM
        </a>
        <a routerLink="/images" routerLinkActive="active" class="nav-link">
          <svg class="icon icon-image" viewBox="0 0 24 24">
            <path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/>
          </svg>
          Describe tu Imagen
        </a>
      </nav>
      <button class="theme-toggle" (click)="toggleTheme()" [title]="(isDarkTheme$ | async) ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'">
        <svg *ngIf="isDarkTheme$ | async" class="icon" viewBox="0 0 24 24">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
        </svg>
        <svg *ngIf="!(isDarkTheme$ | async)" class="icon" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="5"/>
          <path d="m12 1-1 3-1-3 1-3 1 3zM21 12l-3 1 3 1 3-1-3-1zM12 21l-1 3-1-3 1-3 1 3zM4.22 4.22l1.42 1.42L4.22 7.07 2.8 5.65l1.42-1.43zM18.36 18.36l1.42 1.42-1.42 1.42-1.42-1.42 1.42-1.42zM1 12l3 1-3 1-3-1 3-1zM18.36 5.64l1.42-1.42 1.42 1.42-1.42 1.42-1.42-1.42zM4.22 18.36l1.42-1.42 1.42 1.42-1.42 1.42-1.42-1.42z"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 VisionAI - Aplicación de Inteligencia Artificial Reactiva</p>
    </div>
  </footer>
</div>
